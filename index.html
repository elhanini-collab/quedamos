<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Quedamos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1f1e; --muted:#6b706d; --line:#e4e1d9;
  --accent:#1f6f5c; --accent-soft:#dcefe8;
  --ok:#2e8b57; --warn:#d99a1e; --late:#c8463d;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#141615; --card:#1e2120; --ink:#ecebe7; --muted:#9aa09c; --line:#2d3230;
    --accent:#4fb59a; --accent-soft:#1f3a33; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#141615; --card:#1e2120; --ink:#ecebe7; --muted:#9aa09c; --line:#2d3230;
  --accent:#4fb59a; --accent-soft:#1f3a33; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 0 8px;font-weight:600}
main{padding:0 16px 110px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.late{background:var(--late)} .dot.new{background:var(--muted)}
.btn{border:0;border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer;
  background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--late);border:1px solid var(--line)}
.quick{display:flex;gap:6px;margin-top:10px}
.quick .btn{flex:1;padding:8px 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:58px;height:58px;border-radius:50%;
  border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.bday{font-size:14px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.overlay.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);
  border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);z-index:21;
  transform:translateY(100%);transition:transform .22s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{border-left:2px solid var(--line);padding:2px 0 10px 12px;margin-left:4px}
.log .sub{display:flex;justify-content:space-between;gap:8px}
.icon-btn{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Quedamos</h1>
  <button class="icon-btn" id="menuBtn" aria-label="Ajustes">⋯</button>
</header>
<main id="app"></main>
<button class="fab" id="addBtn" aria-label="Añadir persona">+</button>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
// ---------- datos ----------
const KEY = 'quedamos.v1';
const CIRCLES = {
  cercano:   {label:'Cercanos',      days:14},
  amigo:     {label:'Amigos',        days:30},
  excompa:   {label:'Ex-compañeros', days:90},
  conocido:  {label:'Conocidos',     days:180},
};
const TYPES = {
  mensaje: {label:'Mensaje', icon:'💬'},
  llamada: {label:'Llamada', icon:'📞'},
  quedada: {label:'Quedada', icon:'☕'},
};
const WEEKLY_PICKS = 3;

let db = load();
let filter = 'todos';
var toastTimer, storageWarned = false;

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.people)) return d; }catch(e){}
  return {people:[]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ if(!storageWarned){ storageWarned=true; setTimeout(()=>toast('Este navegador no guarda datos: se perderán al cerrar'),300); } } }
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const toISO = d => { const z=new Date(d); z.setMinutes(z.getMinutes()-z.getTimezoneOffset()); return z.toISOString().slice(0,10); };
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- lógica ----------
function lastOf(p, type){
  const logs = p.logs.filter(l => !type || l.type===type);
  if(!logs.length) return null;
  return logs.reduce((a,b)=> a.date > b.date ? a : b);
}
function status(p){
  // ratio = días desde último contacto / cadencia. Si hay cadencia de quedada, se usa la peor de las dos.
  const t = today();
  const res = [];
  const last = lastOf(p);
  if(last){ res.push({kind:'contacto', since:daysBetween(parseISO(last.date),t), cad:p.cadence}); }
  else res.push({kind:'contacto', since:null, cad:p.cadence});
  if(p.meetCadence){
    const lm = lastOf(p,'quedada');
    res.push({kind:'quedada', since: lm ? daysBetween(parseISO(lm.date),t) : null, cad:p.meetCadence});
  }
  let worst = null;
  for(const r of res){
    r.ratio = r.since===null ? 1.01 : r.since / r.cad;   // sin registros: "toca" pero sin alarma
    r.due = r.since===null ? 0 : r.cad - r.since;
    if(!worst || r.ratio > worst.ratio) worst = r;
  }
  const level = worst.since===null ? 'new' : worst.ratio >= 1.25 ? 'late' : worst.ratio >= 0.85 ? 'warn' : 'ok';
  return {...worst, level};
}
function statusText(p, s){
  const last = lastOf(p);
  const lastTxt = last ? `${TYPES[last.type].icon} hace ${fmtDays(daysBetween(parseISO(last.date),today()))}` : 'Sin registros todavía';
  let dueTxt = '';
  if(s.since!==null){
    const what = s.kind==='quedada' ? 'quedar' : 'escribir';
    dueTxt = s.due < 0 ? ` · toca ${what} (${fmtDays(-s.due)} tarde)` : s.due===0 ? ` · toca ${what} hoy` : '';
  }
  return lastTxt + dueTxt;
}
function fmtDays(n){
  if(n===0) return 'hoy';
  if(n<14) return n===1?'1 día':`${n} días`;
  if(n<60) return `${Math.round(n/7)} sem.`;
  if(n<365) return `${Math.round(n/30)} meses`;
  const y = Math.round(n/365*10)/10; return `${y} años`;
}
function nextBirthday(p){
  if(!p.birthday) return null;
  const [m,d] = p.birthday.split('-').map(Number);
  const t = today();
  let nb = new Date(t.getFullYear(), m-1, d);
  if(nb < t) nb = new Date(t.getFullYear()+1, m-1, d);
  return daysBetween(t, nb);
}
function weekKey(){ const t=today(); const day=(t.getDay()+6)%7; t.setDate(t.getDate()-day); return toISO(t); }
function weeklyPicks(){
  // Propuesta semanal estable: se calcula una vez por semana y solo cambia si haces contacto con alguien.
  const wk = weekKey();
  const contactedThisWeek = id => { const p=db.people.find(x=>x.id===id); const l=p&&lastOf(p); return l && l.date >= wk; };
  if(db.picks && db.picks.week===wk){
    const alive = db.picks.ids.filter(id => db.people.some(p=>p.id===id));
    return alive.map(id=>({id, done:contactedThisWeek(id)}));
  }
  const ranked = db.people
    .map(p=>({p, s:status(p)}))
    .filter(x=> x.s.ratio >= 0.85)
    .sort((a,b)=> b.s.ratio - a.s.ratio)
    .slice(0, WEEKLY_PICKS);
  db.picks = {week:wk, ids:ranked.map(x=>x.p.id)};
  save();
  return db.picks.ids.map(id=>({id, done:false}));
}

// ---------- render ----------
const app = document.getElementById('app');
function render(){
  if(!db.people.length){
    app.innerHTML = `<div class="empty"><p style="font-size:40px;margin:10px 0">👋</p>
      <p><b>Añade a tu gente</b></p>
      <p>Para cada persona eliges cada cuánto quieres saber de ella. La app te propone a quién escribir cada semana.</p>
      <button class="btn primary" onclick="openPerson()">Añadir la primera persona</button></div>`;
    return;
  }
  let html = '';

  // Esta semana
  const picks = weeklyPicks();
  html += `<h2>Esta semana</h2>`;
  if(!picks.length){
    html += `<div class="card sub">Todo al día. Nadie se te está pasando 🎉</div>`;
  } else {
    for(const {id,done} of picks){
      const p = db.people.find(x=>x.id===id); if(!p) continue;
      html += personCard(p, {done});
    }
  }

  // Cumpleaños próximos
  const bdays = db.people.map(p=>({p,n:nextBirthday(p)})).filter(x=>x.n!==null && x.n<=21).sort((a,b)=>a.n-b.n);
  if(bdays.length){
    html += `<h2>Cumpleaños</h2><div class="card">` + bdays.map(({p,n})=>
      `<div class="row bday" style="padding:4px 0"><span>🎂</span><span class="grow"><a href="#" onclick="openDetail('${p.id}');return false" style="color:inherit">${esc(p.name)}</a></span>
       <span class="sub">${n===0?'<b>hoy</b>':n===1?'mañana':`en ${n} días`}</span></div>`).join('') + `</div>`;
  }

  // Todos
  html += `<h2>Todos</h2><div class="chips">` +
    [['todos','Todos'], ...Object.entries(CIRCLES).map(([k,v])=>[k,v.label])]
      .filter(([k])=> k==='todos' || db.people.some(p=>p.circle===k))
      .map(([k,l])=>`<button class="chip ${filter===k?'on':''}" onclick="setFilter('${k}')">${l}</button>`).join('') + `</div>`;
  const list = db.people.filter(p=> filter==='todos' || p.circle===filter)
    .map(p=>({p,s:status(p)})).sort((a,b)=> b.s.ratio - a.s.ratio || a.p.name.localeCompare(b.p.name));
  html += list.map(({p})=>personCard(p,{compact:true})).join('');
  app.innerHTML = html;
}
function personCard(p, {compact=false, done=false}={}){
  const s = status(p);
  return `<div class="card" style="${done?'opacity:.55':''}">
    <div class="row" onclick="openDetail('${p.id}')" style="cursor:pointer">
      <span class="dot ${done?'ok':s.level}"></span>
      <div class="grow"><div class="name">${done?'✓ ':''}${esc(p.name)}</div>
        <div class="sub">${esc(statusText(p,s))}</div></div>
      ${compact?'':`<span class="tag">${CIRCLES[p.circle]?.label||''}</span>`}
    </div>
    ${done?'':`<div class="quick">${Object.entries(TYPES).map(([k,t])=>
      `<button class="btn" onclick="quickLog('${p.id}','${k}')">${t.icon} ${t.label}</button>`).join('')}</div>`}
  </div>`;
}
function setFilter(f){ filter=f; render(); }

// ---------- acciones ----------
function quickLog(id, type){
  const p = db.people.find(x=>x.id===id); if(!p) return;
  const entry = {id:uid(), type, date:toISO(today()), note:''};
  p.logs.push(entry); save(); render();
  toast(`${TYPES[type].icon} ${p.name} · apuntado`, ()=> openLog(id, entry.id));
}

// ---------- sheet ----------
const sheet = document.getElementById('sheet'), overlay = document.getElementById('overlay');
function openSheet(html){ sheet.innerHTML = html; overlay.classList.add('open'); requestAnimationFrame(()=>sheet.classList.add('open')); }
function closeSheet(){ sheet.classList.remove('open'); overlay.classList.remove('open'); }
overlay.onclick = closeSheet;

function openPerson(id){
  const p = id ? db.people.find(x=>x.id===id) : {name:'',circle:'amigo',cadence:30,meetCadence:'',birthday:'',notes:''};
  const [bm,bd] = p.birthday ? p.birthday.split('-') : ['',''];
  openSheet(`
    <div class="row"><h1 class="grow">${id?'Editar':'Nueva persona'}</h1><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <label>Nombre</label><input id="f_name" value="${esc(p.name)}" placeholder="Nombre" autocomplete="off">
    <label>Círculo</label>
    <select id="f_circle" onchange="document.getElementById('f_cad').value=CIRCLES[this.value].days">
      ${Object.entries(CIRCLES).map(([k,v])=>`<option value="${k}" ${p.circle===k?'selected':''}>${v.label} (cada ${v.days} días)</option>`).join('')}
    </select>
    <div class="two">
      <div><label>Hablar cada (días)</label><input id="f_cad" type="number" min="1" inputmode="numeric" value="${p.cadence}"></div>
      <div><label>Quedar cada (días)</label><input id="f_meet" type="number" min="1" inputmode="numeric" value="${p.meetCadence||''}" placeholder="opcional"></div>
    </div>
    <label>Cumpleaños</label>
    <div class="two">
      <select id="f_bd"><option value="">Día</option>${Array.from({length:31},(_,i)=>{const v=String(i+1).padStart(2,'0');return `<option ${bd===v?'selected':''}>${v}</option>`}).join('')}</select>
      <select id="f_bm"><option value="">Mes</option>${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'].map((m,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${bm===v?'selected':''}>${m}</option>`}).join('')}</select>
    </div>
    <label>Notas (familia, trabajo, de qué hablasteis…)</label>
    <textarea id="f_notes">${esc(p.notes)}</textarea>
    <div style="display:flex;gap:8px;margin-top:16px">
      ${id?`<button class="btn danger" onclick="deletePerson('${id}')">Eliminar</button>`:''}
      <span class="grow"></span>
      <button class="btn primary" onclick="savePerson('${id||''}')">Guardar</button>
    </div>`);
  if(!id) setTimeout(()=>document.getElementById('f_name').focus(), 250);
}
function savePerson(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Pon un nombre'); return; }
  const bd = document.getElementById('f_bd').value, bm = document.getElementById('f_bm').value;
  const data = {
    name,
    circle: document.getElementById('f_circle').value,
    cadence: Math.max(1, parseInt(document.getElementById('f_cad').value)||30),
    meetCadence: parseInt(document.getElementById('f_meet').value)||null,
    birthday: bd && bm ? `${bm}-${bd}` : '',
    notes: document.getElementById('f_notes').value,
  };
  if(id){ Object.assign(db.people.find(x=>x.id===id), data); }
  else db.people.push({id:uid(), logs:[], created:toISO(today()), ...data});
  save(); closeSheet(); render();
  if(id) openDetail(id);
}
// Confirmación dentro de la propia hoja (sin diálogos del navegador)
let pendingConfirm = null;
function askConfirm(msg, okLabel, onOk){
  pendingConfirm = onOk;
  openSheet(`<h1 style="margin-bottom:8px">${esc(msg)}</h1>
    <p class="sub">Esta acción no se puede deshacer.</p>
    <div style="display:flex;gap:8px;margin-top:16px"><span class="grow"></span>
      <button class="btn ghost" onclick="pendingConfirm=null;closeSheet()">Cancelar</button>
      <button class="btn primary" style="background:var(--late)" onclick="const f=pendingConfirm;pendingConfirm=null;f&&f()">${esc(okLabel)}</button></div>`);
}
function deletePerson(id){
  const p = db.people.find(x=>x.id===id);
  askConfirm(`¿Eliminar a ${p.name} y todo su historial?`, 'Eliminar', ()=>{
    db.people = db.people.filter(x=>x.id!==id); save(); closeSheet(); render(); toast('Eliminado');
  });
}

function openDetail(id){
  const p = db.people.find(x=>x.id===id); if(!p) return;
  const s = status(p);
  const logs = [...p.logs].sort((a,b)=> b.date.localeCompare(a.date));
  const nb = nextBirthday(p);
  openSheet(`
    <div class="row"><span class="dot ${s.level}"></span><h1 class="grow">${esc(p.name)}</h1>
      <button class="icon-btn" onclick="openPerson('${id}')" aria-label="Editar">✎</button>
      <button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="sub" style="margin-top:4px">${CIRCLES[p.circle]?.label} · hablar cada ${p.cadence} días${p.meetCadence?` · quedar cada ${p.meetCadence}`:''}${nb!==null?` · 🎂 ${nb===0?'hoy':`en ${nb} días`}`:''}</div>
    <div class="sub" style="margin-top:2px">${esc(statusText(p,s))}</div>
    <div class="quick">${Object.entries(TYPES).map(([k,t])=>
      `<button class="btn" onclick="openLog('${id}',null,'${k}')">${t.icon} ${t.label}</button>`).join('')}</div>
    ${p.notes?`<h2>Notas</h2><div class="card" style="white-space:pre-wrap">${esc(p.notes)}</div>`:''}
    <h2>Historial</h2>
    ${logs.length? logs.map(l=>`<div class="log" onclick="openLog('${id}','${l.id}')" style="cursor:pointer">
        <div class="sub"><span>${TYPES[l.type].icon} ${TYPES[l.type].label}</span><span>${parseISO(l.date).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}</span></div>
        ${l.note?`<div style="white-space:pre-wrap">${esc(l.note)}</div>`:''}</div>`).join('')
      : `<div class="sub">Aún no hay contactos registrados.</div>`}
  `);
}
function openLog(pid, lid, type){
  const p = db.people.find(x=>x.id===pid);
  const l = lid ? p.logs.find(x=>x.id===lid) : {type:type||'mensaje', date:toISO(today()), note:''};
  openSheet(`
    <div class="row"><h1 class="grow">${esc(p.name)}</h1><button class="icon-btn" onclick="openDetail('${pid}')">✕</button></div>
    <label>Tipo</label>
    <select id="l_type">${Object.entries(TYPES).map(([k,t])=>`<option value="${k}" ${l.type===k?'selected':''}>${t.icon} ${t.label}</option>`).join('')}</select>
    <label>Fecha</label><input id="l_date" type="date" value="${l.date}" max="${toISO(today())}">
    <label>Nota (opcional)</label><textarea id="l_note" placeholder="De qué hablasteis, qué tiene pendiente…">${esc(l.note)}</textarea>
    <div style="display:flex;gap:8px;margin-top:16px">
      ${lid?`<button class="btn danger" onclick="deleteLog('${pid}','${lid}')">Borrar</button>`:''}
      <span class="grow"></span>
      <button class="btn primary" onclick="saveLog('${pid}','${lid||''}')">Guardar</button>
    </div>`);
}
function saveLog(pid, lid){
  const p = db.people.find(x=>x.id===pid);
  const data = {type:document.getElementById('l_type').value, date:document.getElementById('l_date').value||toISO(today()), note:document.getElementById('l_note').value.trim()};
  if(lid) Object.assign(p.logs.find(x=>x.id===lid), data);
  else p.logs.push({id:uid(), ...data});
  save(); render(); openDetail(pid);
}
function deleteLog(pid, lid){
  const p = db.people.find(x=>x.id===pid);
  p.logs = p.logs.filter(x=>x.id!==lid); save(); render(); openDetail(pid);
}

// ---------- ajustes / copia ----------
function openMenu(){
  const total = db.people.reduce((n,p)=>n+p.logs.length,0);
  openSheet(`
    <div class="row"><h1 class="grow">Ajustes</h1><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <p class="sub">${db.people.length} personas · ${total} contactos registrados. Los datos se guardan solo en este dispositivo: haz copia de vez en cuando.</p>
    <div class="card"><div class="row"><div class="grow"><b>Exportar copia</b><div class="sub">Descarga un archivo JSON</div></div>
      <button class="btn" onclick="exportData()">Exportar</button></div></div>
    <div class="card"><div class="row"><div class="grow"><b>Importar copia</b><div class="sub">Sustituye los datos actuales</div></div>
      <label class="btn" style="margin:0">Importar<input type="file" accept="application/json" hidden onchange="importData(this.files[0])"></label></div></div>
  `);
}
function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `quedamos-${toISO(today())}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importData(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!Array.isArray(d.people)) throw 0;
      askConfirm(`¿Importar ${d.people.length} personas y sustituir los datos actuales?`, 'Importar', ()=>{
        db = d; save(); closeSheet(); render(); toast('Copia importada'); });
    }catch(e){ toast('Archivo no válido'); } };
  r.readAsText(file);
}

// ---------- toast ----------
function toast(msg, onTap){
  const t = document.getElementById('toast');
  t.textContent = msg + (onTap ? ' · añadir nota' : '');
  t.style.pointerEvents = onTap ? 'auto' : 'none';
  t.onclick = onTap ? ()=>{ t.classList.remove('show'); onTap(); } : null;
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); t.style.pointerEvents='none'; }, onTap?3500:2000);
}

document.getElementById('addBtn').onclick = ()=>openPerson();
document.getElementById('menuBtn').onclick = openMenu;
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
